name: JavaScript CAS tests and offline package

on:
  push:
    paths:
      - 'js-cas/**'
      - '.github/workflows/javascript-cas.yml'
  pull_request:
    paths:
      - 'js-cas/**'
      - '.github/workflows/javascript-cas.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js-cas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install exact Nerdamer version
        run: npm install --no-audit --no-fund
      - name: Test symbolic operations
        run: npm test
      - name: Build offline distribution
        run: npm run build:offline
      - name: Verify offline files
        run: |
          test -s offline/index.html
          test -s offline/learn.html
          test -s offline/app.js
          test -s offline/cas-adapter.js
          test -s offline/vendor/nerdamer.bundle.js
          test -s offline/vendor/NERDAMER-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: math-dreamweaver-offline-js-cas
          path: js-cas/offline/
